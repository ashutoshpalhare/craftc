name: Prepare dependency security update
# Reusable workflow for controlled, lockfile-backed security refreshes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create isolated security branch
        id: branch
        run: |
          BRANCH="security/dependency-refresh-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Upgrade patched Vite and vulnerable transitive dependencies
        run: |
          npm pkg set 'devDependencies.vite=^8.3.7'
          npm pkg set 'overrides.nanoid=^3.3.18'
          npm pkg set 'overrides.source-map-js=^1.2.2'
          npm install --package-lock-only

      - name: Install exact lockfile and audit
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Run curriculum, DSA, practice and production checks
        run: |
          npm run check:dsa
          npm run build

      - name: Commit and open security pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
            exit 0
          fi
          git commit -m "fix(deps): patch vulnerable build dependencies"
          git push --set-upstream origin "$BRANCH"
          echo "Dependency update branch pushed: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
